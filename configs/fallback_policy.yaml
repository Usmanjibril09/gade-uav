# Fallback-action lookup table (spec §8).
# Rule (not learned): (mission_phase x primary_attack_family) -> fallback.
#
# Fallback actions (spec §8):
#   NO_OP                  -- silence, no emission
#   STATIC_HONEY_RESPONSE  -- pre-computed MAVLink from fixed library
#   RATE_LIMIT_SOURCE      -- network-layer throttle, no generation
#   HAND_OFF_TO_IDS        -- log for later analysis
#
# The attack-family keys are the canonical T1..T18 codes from
# docs/01_threat_model.md (as extended by Amendment A1). If the primary
# attack cannot be identified, use the "unknown" row.
#
# Any change here requires a spec amendment (§12).

default_action: HAND_OFF_TO_IDS

# Row: attack_family. Column: mission_phase.
# When choosing under critical phases we bias toward NO_OP (do nothing
# is always safe). In non-critical phases we bias toward active but
# non-generative responses.

table:
  T1_Reconnaissance:
    idle:                  STATIC_HONEY_RESPONSE
    takeoff:               NO_OP
    cruise:                STATIC_HONEY_RESPONSE
    precision_hover:       NO_OP
    landing:               NO_OP
    emergency_recovery:    NO_OP
    post_landing:          STATIC_HONEY_RESPONSE

  T2_DoS:
    idle:                  RATE_LIMIT_SOURCE
    takeoff:               NO_OP
    cruise:                RATE_LIMIT_SOURCE
    precision_hover:       NO_OP
    landing:               NO_OP
    emergency_recovery:    NO_OP
    post_landing:          RATE_LIMIT_SOURCE

