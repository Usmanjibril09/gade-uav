[project]
name = "gade-uav"
version = "0.1.0"
description = "GADe-UAV simulator, runtime safety shield, and evaluation artifacts"
readme = "README.md"
authors = [
    { name = "Usmanjibril09", email = "wushi09.uj@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastexcel>=0.21.0",
    "hydra-core>=1.3",
    "jsonschema>=4.26.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.9",
    "networkx>=3.3",
    "numpy>=1.26,<2.0",
    "omegaconf>=2.3",
    "pandas>=2.2",
    "polars>=1.44.2",
    "pyarrow>=15.0",
    "pymavlink>=2.4.49",
    "rich>=13.7",
    "scapy>=2.7.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "seaborn>=0.13",
    "torch==2.2.2",
    "torchmetrics>=1.9.0",
    "tqdm>=4.66",
    "transformers==4.46.3",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.29",
    "jupyter>=1.0",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
markers = [
    "integration: end-to-end tests that replay real Phase 1 traces (slower)",
]
